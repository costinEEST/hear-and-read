  <p><span id="v40005001" class="verse"><strong>5</strong> Amikor Jézus meglátta a sokaságot, felment a hegyre.</span>
     <span id="v40005002" class="verse"><sup>2</sup> Szólni kezdett, és tanította őket:</span></p>
  <p><span id="v40005003-1" class="verse"><sup>3</sup> „Boldogok, akik tudják,</span></p>
  <p><span id="v40005003-2" class="verse">hogy szükségük van Istenre.</span>
     <span id="v40005004" class="verse"><sup>4</sup> Boldogok, akik gyászolnak, mert ők megvigasztaltatnak.</span>
     <span id="v40005005" class="verse"><sup>5</sup> Boldogok a szelídek.</span></p>
